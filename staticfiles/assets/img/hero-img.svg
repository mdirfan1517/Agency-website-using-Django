<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04abff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008d7d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />

  <!-- Large Circle -->
  <circle cx="400" cy="300" r="200" fill="white" opacity="0.1">
    <animate attributeName="r" values="200;220;200" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Elements -->
  <g transform="translate(400,300)">
    <!-- Rotating Square -->
    <rect x="-50" y="-50" width="100" height="100" fill="white" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </rect>
    
    <!-- Pulsing Circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.2">
      <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Elements -->
  <g>
    <circle cx="200" cy="200" r="30" fill="white" opacity="0.2">
      <animate attributeName="cy" values="200;220;200" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="400" r="25" fill="white" opacity="0.2">
      <animate attributeName="cy" values="400;380;400" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Wave Pattern -->
  <path d="M0,300 Q200,250 400,300 T800,300" stroke="white" stroke-width="2" fill="none" opacity="0.2">
    <animate attributeName="d" values="M0,300 Q200,250 400,300 T800,300;M0,300 Q200,350 400,300 T800,300;M0,300 Q200,250 400,300 T800,300" dur="8s" repeatCount="indefinite" />
  </path>
</svg> 